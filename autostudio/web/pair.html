<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AutoStudio">
  <title>连接电脑 · AutoStudio</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { overflow: auto; }
    .pair-page { min-height: 100dvh; display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); }
    .pair-box { width: min(420px, 100%); }
    .pair-logo { width: 56px; height: 56px; border-radius: 16px; background: var(--grad); display: grid; place-items: center; margin: 0 auto 14px; box-shadow: 0 10px 30px rgba(99, 102, 241, .35); }
    .pair-logo svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 2.2; fill: none; stroke-linejoin: round; }
    h1 { text-align: center; font-size: 21px; margin: 0 0 4px; }
    .sub { text-align: center; color: var(--muted); margin: 0 0 22px; font-size: 13.5px; }
    .code-input { font-family: var(--mono); font-size: 30px; letter-spacing: .4em; text-align: center; padding: 12px 10px 12px 22px; height: auto; }
    .btn.big { height: 46px; font-size: 15px; margin-top: 6px; }
    .err { color: var(--err); font-size: 13px; min-height: 20px; margin-top: 8px; text-align: center; }
    .tips { margin-top: 22px; display: grid; gap: 10px; }
    .tip { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); font-size: 13px; color: var(--text-2); }
    .tip b { color: var(--text); }
    .tip .icon { margin-top: 2px; color: var(--accent-2); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="pair-page">
    <div class="pair-box">
      <div class="pair-logo"><svg viewBox="0 0 24 24"><path d="m7 4 13 8-13 8z"/></svg></div>
      <h1 id="title">连接到电脑</h1>
      <p class="sub" id="sub">输入电脑上「手机连接」页面显示的 6 位配对码</p>

      <form id="form" class="card">
        <div class="field">
          <label for="code">配对码</label>
          <input id="code" class="input code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000" required>
        </div>
        <div class="field" style="margin-bottom:4px">
          <label for="name">这台设备的名字（可不填）</label>
          <input id="name" class="input" maxlength="40" placeholder="例如：我的手机">
        </div>
        <button class="btn primary block big" id="go" type="submit">连接</button>
        <div class="err" id="err"></div>
      </form>

      <div id="inapp" class="card hidden" style="text-align:center">
        <p style="margin-top:0">这台手机和电脑的连接已经断开了（可能在电脑上被移除了）。</p>
        <a class="btn primary block big" href="autostudio://home">重新连接</a>
      </div>

      <div class="tips">
        <div class="tip hidden" id="tip-wechat"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          <div>你在微信里打开了这个页面。微信里不能下载 App：点右上角 <b>···</b>，选「在浏览器打开」。</div></div>
        <div class="tip hidden" id="tip-apk"><svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          <div><b>安卓手机推荐装 App：</b>扫码就能连，记住多台电脑，视频一键存进相册。<br>
            <a class="btn sm" style="margin-top:8px" href="/download/AutoStudio.apk">下载 AutoStudio App</a></div></div>
        <div class="tip hidden" id="tip-ios"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <div><b>iPhone：</b>连上之后，点 Safari 底部的「分享」按钮 →「添加到主屏幕」，以后从桌面图标打开，就像 App 一样。</div></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent;
      var inApp = /AutoStudioApp\//.test(ua);
      var $ = function (id) { return document.getElementById(id); };

      fetch("/api/remote/whoami", { credentials: "same-origin" }).then(function (r) {
        if (r.ok) location.replace("/");     // already paired
      }).catch(function () {});

      if (inApp) {
        $("form").classList.add("hidden");
        $("inapp").classList.remove("hidden");
        $("sub").textContent = "需要重新配对";
      }
      fetch("/api/remote/hello").then(function (r) { return r.json(); }).then(function (h) {
        $("title").textContent = "连接到「" + h.pc_name + "」";
        if (h.apk && /Android/i.test(ua) && !inApp) $("tip-apk").classList.remove("hidden");
      }).catch(function () {});
      if (/MicroMessenger/i.test(ua)) $("tip-wechat").classList.remove("hidden");
      if (/iPhone|iPad/.test(ua) && !inApp) $("tip-ios").classList.remove("hidden");

      var code = $("code");
      var fromLink = (location.hash || "").replace(/\D/g, "").slice(0, 6);
      if (fromLink) code.value = fromLink;
      code.addEventListener("input", function () { code.value = code.value.replace(/\D/g, "").slice(0, 6); });

      $("form").addEventListener("submit", function (e) {
        e.preventDefault();
        var btn = $("go");
        btn.disabled = true;
        btn.textContent = "连接中…";
        $("err").textContent = "";
        fetch("/api/remote/pair", {
          method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json", "X-AutoStudio": "1" },
          body: JSON.stringify({ code: code.value, name: $("name").value.trim(), platform: /iPhone|iPad/.test(ua) ? "ios" : /Android/.test(ua) ? "android-web" : "web" })
        }).then(function (r) {
          return r.json().then(function (d) {
            if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
            history.replaceState(null, "", "/pair");   // drop the used code from the address bar
            location.replace("/");
          });
        }).catch(function (err) {
          $("err").textContent = err.message || "连接失败";
          btn.disabled = false;
          btn.textContent = "连接";
        });
      });
      if (!fromLink) code.focus();
    })();
  </script>
</body>
</html>
