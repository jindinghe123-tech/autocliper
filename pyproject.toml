[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autostudio"
version = "0.1.0"
description = "开源 AI Agent 工作台：用 ChatGPT 订阅或任意大模型 API，帮你转字幕、剪视频、跑每日自动任务。"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["agent", "llm", "chatgpt", "ffmpeg", "whisper", "subtitles", "video-editing", "youtube", "xiaohongshu"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10,<4",
  "imageio-ffmpeg>=0.5",
  "numpy>=1.24",
  "pillow>=10",
]

[project.urls]
Homepage = "https://autostudio.jindinghe123.workers.dev"
Repository = "https://github.com/jindinghe123-tech/autocliper"

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
tts = ["edge-tts>=6.1", "sherpa-onnx>=1.12"]
download = ["yt-dlp"]
publish = ["playwright>=1.45"]
all = ["faster-whisper>=1.1", "edge-tts>=6.1", "sherpa-onnx>=1.12", "yt-dlp", "playwright>=1.45"]
dev = ["ruff", "pytest"]

[project.scripts]
autostudio = "autostudio.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["autostudio"]
